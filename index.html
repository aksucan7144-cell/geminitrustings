<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giveaway Hunter - Çekiliş Avcısı</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 25px; color: #38bdf8; font-size: 2rem; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border-left: 5px solid #38bdf8; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .info h3 { font-size: 1.2rem; margin-bottom: 8px; color: #f1f5f9; }
        .info p { font-size: 0.9rem; color: #94a3b8; margin: 3px 0; }
        .badge { background: #0284c7; color: white; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; display: inline-block; margin-bottom: 8px; }
        .btn { background: #22c55e; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; transition: background 0.2s; }
        .btn:hover { background: #16a34a; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎯 Giveaway Hunter</h1>
        <div id="giveaway-list"></div>
    </div>

    <script>
        // Veriler doğrudan burada (CORS hatası veya dosya okuma sorunu sıfır)
        const giveaways = [
            {
                "title": "27 inç 165Hz IPS Gaming Monitör Çekilişi",
                "username": "monitor_avcisi_tr",
                "post_url": "https://www.instagram.com/",
                "followers": 4500,
                "comments": 19,
                "end_date": "2026-10-30"
            },
            {
                "title": "Ağustos Ayı Özel 24 inç Monitör Hediyesi",
                "username": "oyuncu_ekipmanlari",
                "post_url": "https://www.instagram.com/",
                "followers": 12000,
                "comments": 64,
                "end_date": "2026-11-05"
            }
        ];

        // Yorum sayısına göre azdan çoğa (kazanma şansı en yüksek olan en üste) sıralama
        giveaways.sort((a, b) => a.comments - b.comments);

        const listContainer = document.getElementById('giveaway-list');

        giveaways.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="info">
                    <span class="badge">Yorum: ${item.comments} (Şans Yüksek)</span>
                    <h3>${item.title}</h3>
                    <p>👤 Hesap: <strong>@${item.username}</strong></p>
                    <p>📅 Bitiş: ${item.end_date}</p>
                </div>
                <a href="${item.post_url}" target="_blank" class="btn">Instagram'da Aç</a>
            `;
            listContainer.appendChild(card);
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çekiliş Avcısı Pro - Gerçek Veri</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0b10;
            --bg-secondary: #121520;
            --bg-card: #1a1e2e;
            --accent-green: #00ff88;
            --accent-red: #ff3366;
            --accent-purple: #7000ff;
            --text-main: #f0f3f8;
            --text-muted: #8a94a6;
            --border-color: #2a3146;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding: 20px; min-height: 100vh; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 25px; }
        header h1 { font-size: 2.2rem; color: var(--accent-green); display: flex; align-items: center; justify-content: center; gap: 12px; }
        header p { color: var(--text-muted); font-size: 0.95rem; margin-top: 5px; }

        .info-bar {
            background: rgba(112, 0, 255, 0.15);
            border-left: 4px solid var(--accent-purple);
            padding: 14px 18px;
            margin-bottom: 25px;
            border-radius: 6px;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .results-container { display: flex; flex-direction: column; gap: 15px; }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover { border-color: var(--accent-purple); transform: translateY(-2px); }

        .card-main { display: flex; gap: 20px; align-items: center; width: 100%; }

        .score-badge {
            min-width: 100px;
            text-align: center;
            padding: 12px 8px;
            border-radius: 10px;
            font-weight: bold;
        }

        .high-score { background: rgba(0, 255, 136, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .low-score { background: rgba(255, 51, 102, 0.15); color: var(--accent-red); border: 1px solid var(--accent-red); }

        .score-val { font-size: 1.5rem; display: block; }
        .score-lbl { font-size: 0.7rem; opacity: 0.8; text-transform: uppercase; }

        .card-details { flex: 1; }
        .card-details h3 { font-size: 1.1rem; margin-bottom: 8px; color: var(--text-main); }

        .user-box {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-secondary);
            padding: 5px 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-family: monospace;
            color: var(--accent-green);
        }

        .go-btn {
            background: var(--accent-purple);
            color: white;
            text-decoration: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            transition: 0.2s;
        }

        .go-btn:hover { opacity: 0.9; }

        .dates-line {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
            color: #ffaa00;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .stats-line { display: flex; gap: 15px; font-size: 0.85rem; color: var(--text-muted); flex-wrap: wrap; }
        .stats-line span i, .dates-line span i { margin-right: 5px; }

        .loading { text-align: center; padding: 40px; color: var(--text-muted); font-size: 1.2rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><i class="fa-solid fa-crosshair"></i> Çekiliş Avcısı Pro</h1>
        <p>Instagram'daki <b>tarihi geçmemiş gerçek çekilişler</b>. Az katılımlı yüksek şanslılar en üsttedir.</p>
    </header>

    <div class="info-bar">
        <span>Toplam Aktif Çekiliş: <strong id="itemCount">...</strong></span>
        <span style="font-size:0.85rem; opacity:0.8;">Sıralama: Katılım Sayısı (Az ➔ Çok)</span>
    </div>

    <div class="results-container" id="results">
        <div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Gerçek Instagram verileri yükleniyor...</div>
    </div>
</div>

<script>
    async function loadRealGiveaways() {
        try {
            // Gerçek Python botunun ürettiği JSON dosyasından veri çekme
            const response = await fetch('cekilisler.json');
            if (!response.ok) throw new Error("Veri bulunamadı");
            let data = await response.json();

            // Sadece tarihi geçmemiş (aktif) olanları filtrele
            const now = new Date();
            data = data.filter(item => new Date(item.end_date) >= now);

            // Kazanma Şansına Göre Sırala (Katılım sayısı az olan EN ÜSTE)
            data.sort((a, b) => a.comments - b.comments);

            renderResults(data);
        } catch (err) {
            document.getElementById('results').innerHTML = `
                <div class="loading" style="color:var(--accent-red)">
                    <i class="fa-solid fa-triangle-exclamation"></i> Gerçek çekiliş verileri yüklenemedi.<br>
                    <small style="color:var(--text-muted); font-size:0.9rem;">Python botunu (bot.py) çalıştırıp 'cekilisler.json' dosyasını oluşturmalısın.</small>
                </div>`;
        }
    }

    function renderResults(data) {
        const container = document.getElementById('results');
        container.innerHTML = '';

        if (data.length === 0) {
            container.innerHTML = '<div class="loading">Şu an aktif (tarihi geçmemiş) çekiliş bulunamadı.</div>';
            return;
        }

        data.forEach((item, index) => {
            // Katılım sırasına göre şans skoru hesaplama
            let chanceScore = Math.max(10, 100 - Math.floor((item.comments / 50)));
            const isHigh = chanceScore >= 60;

            const card = document.createElement('div');
            card.className = 'card';
            
            card.innerHTML = `
                <div class="card-main">
                    <div class="score-badge ${isHigh ? 'high-score' : 'low-score'}">
                        <span class="score-val">%${chanceScore}</span>
                        <span class="score-lbl">Kazanma Şansı</span>
                    </div>
                    <div class="card-details">
                        <h3>${item.title}</h3>
                        <div class="user-box">
                            <span>@${item.username}</span>
                            <a href="${item.post_url}" target="_blank" class="go-btn"><i class="fa-solid fa-arrow-up-right-from-square"></i> Instagram'da Aç</a>
                        </div>
                        <div class="dates-line">
                            <span><i class="fa-solid fa-calendar-plus"></i> Başlangıç: ${item.start_date}</span>
                            <span><i class="fa-solid fa-calendar-xmark"></i> Bitiş: ${item.end_date}</span>
                        </div>
                        <div class="stats-line">
                            <span><i class="fa-solid fa-users"></i> ${item.followers.toLocaleString()} Takipçi</span>
                            <span><i class="fa-solid fa-comment"></i> ${item.comments.toLocaleString()} Katılım</span>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });

        document.getElementById('itemCount').innerText = data.length;
    }

    window.onload = loadRealGiveaways;
</script>

</body>
</html>

name: Instagram Giveaway Scraper

on:
  schedule:
    - cron: '0 */6 * * *' # Her 6 saatte bir otomatik çalışır
  workflow_dispatch: # Elle de başlatabilmeni sağlar

jobs:
  build:
    runs-runs-on: ubuntu-latest

    steps:
    - name: Repositoriyi Kopyala
      uses: actions/checkout@v3

    - name: Python Kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Botu Çalıştır
      run: python bot.py

    - name: Yeni JSON Verisini GitHub'a Kaydet
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add cekilisler.json
        git commit -m "Auto update giveaways" || exit 0
        git push
